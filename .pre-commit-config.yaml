exclude: ^(examples|docs)/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        name: ruff lint
        types_or: [ python, pyi ]
        args: [ --output-format=concise ]
      - id: ruff-check
        name: ruff isort
        types_or: [ python, pyi ]
        args: [ --select, I, --fix ]
      - id: ruff-format
        name: ruff format
        types_or: [ python, pyi ]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        types_or: [ c, c++, cuda ]
  - repo: local
    hooks:
      - id: meson-format
        name: meson format
        language: python
        entry: meson format -i
        files: (^|/)meson(\.build|\.options|_options\.txt)$
