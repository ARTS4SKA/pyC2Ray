exclude: examples|docs
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        name: ruff lint
        types_or: [ python, pyi ]
        args: [ --output-format=concise ]
      - id: ruff-check
        name: ruff isort
        types_or: [ python, pyi ]
        args: [ --select, I, --fix ]
      - id: ruff-format
        name: ruff format
        types_or: [ python, pyi ]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.3
    hooks:
      - id: clang-format
  - repo: https://github.com/fortran-lang/fprettify
    rev: v0.3.7
    hooks:
      - id: fprettify
